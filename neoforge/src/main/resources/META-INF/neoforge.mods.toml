modLoader = "javafml"
loaderVersion = "[2,)"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "assets/kubex/logo.png"
displayTest = "IGNORE_SERVER_VERSION"
authors = "${mod_author}"
description = '''
${mod_description}
'''

[[dependencies.kubex]]
modId = "neoforge"
mandatory = true
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.kubex]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.kubex]]
modId = "kubejs"
mandatory = true
versionRange = "[${kubejs_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.kubex]]
modId = "rhino"
mandatory = true
versionRange = "[${rhino_version},)"
ordering = "AFTER"
side = "BOTH"